<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Icon Test 2</title>
  <link rel="apple-touch-icon" href="../apple-touch-icon-v2.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        Arial, sans-serif;
    }

    .header {
      background: #111827;
      color: white;
      padding: 28px 20px 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
    }

    .header p {
      margin: 8px 0 0;
      color: #aeb9cc;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    .card,
    .result {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.06);
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hint {
      margin: -2px 0 10px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 115px;
      resize: vertical;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      line-height: 1.5;
      background: #fff;
      color: #111827;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 16px;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .translate-button {
      margin: 0 0 22px;
      background: #475569;
    }

    .reply-button {
      background: #2563eb;
    }

    .copy-button {
      margin-top: 12px;
      background: #111827;
    }

    .result {
      display: none;
      margin-top: 20px;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .result p {
      margin: 0 0 14px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    .prompt-box {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.65;
    }

    .error {
      display: none;
      margin: 0 0 16px;
      padding: 11px 12px;
      border-radius: 10px;
      background: #fff1f2;
      color: #be123c;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>Buyer Reply Assistant</h1>
    <p>eBay Buyerへの返信を、迷わずシンプルに。</p>
  </header>

  <main class="container">

    <div class="card">

      <div id="error" class="error"></div>

      <div class="field">
        <label for="buyerMessage">
          ① Buyerからのメッセージ・取引状況
        </label>

        <p class="hint">
          Buyerの英文をそのまま貼り付けます。
          Seller側から連絡する場合は、現在の取引状況を日本語で入力できます。
        </p>

        <textarea
          id="buyerMessage"
          placeholder="例：What's the lowest you'll go on this watch?"
        ></textarea>
      </div>

      <button
        type="button"
        class="translate-button"
      >
        Buyerの意味を確認
      </button>

      <div class="field">
        <label for="sellerIntent">
          ② どう対応したい？
        </label>

        <p class="hint">
          Buyerの意味を確認したうえで、
          あなたが伝えたいこと・条件を日本語で入力します。
        </p>

        <textarea
          id="sellerIntent"
          placeholder="例：$350なら販売したい"
        ></textarea>
      </div>

      <button
        type="button"
        class="reply-button"
      >
        返信を作る
      </button>

    </div>

    <section id="result" class="result">

      <h2 id="resultTitle">
        ChatGPTに渡す指示文
      </h2>

      <p id="resultDescription">
        下の内容をコピーしてChatGPTへ送ってください。
      </p>

      <div
        id="promptOutput"
        class="prompt-box"
      ></div>

      <button
        type="button"
        class="copy-button"
      >
        指示文をコピー
      </button>

    </section>

    <div class="footer">
      Buyer Reply Assistant V0
    </div>

  </main>

</body>
</html>
