<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Buyer Reply Assistant</title>
　<link rel="apple-touch-icon" sizes="180x180" href="https://yokkosan160122-boop.github.io/buyer-reply-assistant/apple-touch-icon.png">
　<link rel="manifest" href="./manifest.json">
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        Arial, sans-serif;
    }

    .header {
      background: #111827;
      color: white;
      padding: 28px 20px 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
    }

    .header p {
      margin: 8px 0 0;
      color: #aeb9cc;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 22px 16px 50px;
    }

    .card,
    .result {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 16px rgba(0, 0, 0, 0.06);
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hint {
      margin: -2px 0 10px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 115px;
      resize: vertical;
      border: 1px solid #d7dce5;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      line-height: 1.5;
      background: #fff;
      color: #111827;
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 16px;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .translate-button {
      margin: 0 0 22px;
      background: #475569;
    }

    .reply-button {
      background: #2563eb;
    }

    .copy-button {
      margin-top: 12px;
      background: #111827;
    }

    .result {
      display: none;
      margin-top: 20px;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .result p {
      margin: 0 0 14px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    .prompt-box {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.65;
    }

    .error {
      display: none;
      margin: 0 0 16px;
      padding: 11px 12px;
      border-radius: 10px;
      background: #fff1f2;
      color: #be123c;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>Buyer Reply Assistant</h1>
    <p>eBay Buyerへの返信を、迷わずシンプルに。</p>
  </header>

  <main class="container">

    <div class="card">

      <div id="error" class="error"></div>

      <div class="field">
        <label for="buyerMessage">
          ① Buyerからのメッセージ・取引状況
        </label>

        <p class="hint">
          Buyerの英文をそのまま貼り付けます。
          Seller側から連絡する場合は、現在の取引状況を日本語で入力できます。
        </p>

        <textarea
          id="buyerMessage"
          placeholder="例：What's the lowest you'll go on this watch?"
        ></textarea>
      </div>

      <button
        type="button"
        class="translate-button"
        onclick="createMeaningPrompt()"
      >
        Buyerの意味を確認
      </button>

      <div class="field">
        <label for="sellerIntent">
          ② どう対応したい？
        </label>

        <p class="hint">
          Buyerの意味を確認したうえで、
          あなたが伝えたいこと・条件を日本語で入力します。
        </p>

        <textarea
          id="sellerIntent"
          placeholder="例：$350なら販売したい"
        ></textarea>
      </div>

      <button
        type="button"
        class="reply-button"
        onclick="createReplyPrompt()"
      >
        返信を作る
      </button>

    </div>

    <section id="result" class="result">

      <h2 id="resultTitle">
        ChatGPTに渡す指示文
      </h2>

      <p id="resultDescription">
        下の内容をコピーしてChatGPTへ送ってください。
      </p>

      <div
        id="promptOutput"
        class="prompt-box"
      ></div>

      <button
        type="button"
        class="copy-button"
        onclick="copyPrompt()"
      >
        指示文をコピー
      </button>

    </section>

    <div class="footer">
      Buyer Reply Assistant V0
    </div>

  </main>

  <script>

    function showError(message) {
      const error = document.getElementById("error");

      error.textContent = message;
      error.style.display = "block";

      document.getElementById("result").style.display = "none";
    }


    function showPrompt(title, prompt) {
      const error = document.getElementById("error");
      const result = document.getElementById("result");

      error.style.display = "none";

      document.getElementById("resultTitle").textContent = title;

      document.getElementById("promptOutput").textContent = prompt;

      result.style.display = "block";

      result.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }


    function createMeaningPrompt() {

      const buyerMessage =
        document.getElementById("buyerMessage").value.trim();

      if (!buyerMessage) {
        showError(
          "Buyerからのメッセージを入力してください。"
        );
        return;
      }

      const prompt = `以下はeBayの取引でBuyerから届いたメッセージです。

【Buyerメッセージ】
${buyerMessage}

このメッセージについて、次の2項目だけを日本語で簡潔に説明してください。

① 日本語訳
自然な日本語に訳してください。

② Buyerが確認したいこと
Buyerが何を質問・確認しているのかを簡潔に説明してください。

【重要ルール】
・Buyerの購入意思や感情を勝手に断定しない
・書かれていない事実を追加しない
・事実と推測を分ける
・価格、商品状態、発送、送料、関税、返品条件など、入力されていない情報を勝手に補完しない`;

      showPrompt(
        "Buyerの意味を確認",
        prompt
      );
    }


    function createReplyPrompt() {

      const buyerMessage =
        document.getElementById("buyerMessage").value.trim();

      const sellerIntent =
        document.getElementById("sellerIntent").value.trim();

      if (!buyerMessage) {
        showError(
          "Buyerからのメッセージ・取引状況を入力してください。"
        );
        return;
      }

      if (!sellerIntent) {
        showError(
          "どう対応したいかを入力してください。"
        );
        return;
      }

      const prompt = `あなたはeBay Seller向けのBuyer返信アシスタントです。

以下の取引情報とSellerの希望だけを根拠に、Buyerへ送る返信を作成してください。

【Buyerからのメッセージ・取引状況】
${buyerMessage}

【Sellerがどう対応したいか】
${sellerIntent}

【重要ルール】
・入力されていない価格を勝手に作らない
・入力されていない商品状態を勝手に作らない
・付属品、在庫、発送日、配送日数、到着予定、送料、関税、税金、DDP/DDU、返品条件などを勝手に追加しない
・不明なことは不明として扱う
・Buyerの購入意思や感情を勝手に断定しない
・事実と推測を分ける
・Sellerが入力していない約束や条件を追加しない
・成約を優先するあまりSellerに不利な条件を勝手に約束しない
・英語は丁寧で自然にする
・返信英文は必要以上に長くしない

次の4項目だけを、この順番で出力してください。

① 取引内容の整理
Buyerメッセージがある場合は自然な日本語で意味を説明。
Seller側から連絡するケースでは現在の状況を簡潔に整理。

② どう返すか
取引状況とSellerの希望を踏まえた簡潔な対応方針

③ 送信用英文
そのままeBayへコピーできる短く自然な英文

④ 日本語訳
③の英文の意味をSellerが確認できる自然な日本語訳`;

      showPrompt(
        "返信作成用の指示文",
        prompt
      );
    }


    async function copyPrompt() {

      const text =
        document.getElementById("promptOutput").textContent;

      const button =
        document.querySelector(".copy-button");

      try {

        await navigator.clipboard.writeText(text);

        button.textContent = "コピーしました ✓";

        setTimeout(() => {
          button.textContent = "指示文をコピー";
        }, 1500);

      } catch (e) {

        alert(
          "コピーできませんでした。指示文を長押ししてコピーしてください。"
        );

      }
    }

  </script>

</body>
</html>
